      triggering_events:
        - "submission to official procedure (e.g. legislative procedure)"
        - "public-information disclosure"
        - "publication in Narodne novine (the official gazette)"
      summary: "Croatian statutory-PD carve-out per ZASP Art. 18(3) — CONDITIONAL. Works are protected by copyright from creation, and lose protection only at one of three triggering events: submission to official procedure, public-information disclosure, or publication in Narodne novine. Pre-trigger drafts remain protected. Ingestion MUST restrict to post-trigger texts (i.e. texts as published in Narodne novine), NOT working drafts. See infrastructure/attribution-licenses.json HR-Statutory-PD-Conditional."
    coverage:
      scope: "Official and international legislation pages with ELI metadata and HTML representations. The census contains 4,763 records: 4,529 ingestable laws and 234 correction notices."
      limitations: "Correction notices are tracked in the census but are not treated as standalone ingestable laws. Freshness depends on the scheduled check-updates and drift-detect workflows."
